<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Mô phỏng blog Tâm Anh</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600;700&display=swap">
<style>
/* Layout: bản sao trang bài viết tamanhhospital.vn (Helvetica thân bài, Barlow cho module như site thật) + thanh điều khiển demo tối màu phía trên */
:root{
  --brand:#1c3f94; --brand-d:#122c6b; --brand-50:#eef3fc; --brand-100:#d8e2f6; --gold:#ffc52e;
  --ink:#172033; --txt:#2e3646; --mut:#647089; --line:#e2e7f0; --paper:#ffffff; --tint:#f5f8fd;
  --danger:#c8321e; --ok:#0f7a55; --ok-50:#e6f5ee; --warn:#a15c07; --warn-50:#fff6e0;
  --f-ui:"Barlow",Helvetica,Arial,sans-serif; --f-body:Helvetica,Arial,sans-serif;
  --r-s:6px; --r-m:10px; --r-l:14px; --shadow:0 1px 2px rgba(18,44,107,.06),0 6px 18px rgba(18,44,107,.07);
  color-scheme:light;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{margin:0;height:100%}
body{display:flex;flex-direction:column;background:#1d2230;font-family:var(--f-body)}
button,input,select,textarea{font-family:inherit}
:focus-visible{outline:2px solid var(--gold);outline-offset:2px}

/* ===== Thanh điều khiển demo (không thuộc website) ===== */
.tb{flex:none;background:#0e121b;color:#cfd6e4;font:500 12.5px/1.3 var(--f-ui);display:flex;flex-wrap:wrap;gap:8px 18px;align-items:center;padding:8px 14px;border-bottom:1px solid #000}
.tb .t{color:#fff;font-weight:700;font-size:14px;letter-spacing:.01em}
.tb .g{display:flex;align-items:center;gap:7px}
.tb .g>span{color:#8590a6;text-transform:uppercase;font-size:11px;letter-spacing:.06em}
.sg{display:inline-flex;border:1px solid #2c3446;border-radius:7px;overflow:hidden}
.sg button{border:0;background:#161c29;color:#cfd6e4;padding:5px 10px;font:500 12.5px var(--f-ui);cursor:pointer;border-right:1px solid #2c3446}
.sg button:last-child{border-right:0}
.sg button[aria-pressed="true"]{background:#3a62d4;color:#fff;font-weight:600}
.tb label.ck{display:flex;gap:6px;align-items:center;cursor:pointer}
.tb .note{color:var(--gold)}
.stage{flex:1;min-height:0;display:flex;justify-content:center;align-items:center}
.frame{position:relative;background:var(--paper);width:100%;height:100%;overflow:hidden}
.frame.phone{width:390px;height:min(844px,calc(100% - 28px));border:11px solid #05070b;border-radius:42px;box-shadow:0 24px 70px rgba(0,0,0,.55)}
.frame.tablet{width:820px;height:calc(100% - 28px);border:11px solid #05070b;border-radius:24px}
.vp{height:100%;overflow-y:auto;background:var(--paper);color:var(--txt);font-size:16px;line-height:1.65}
.phone .vp{scrollbar-width:none}.phone .vp::-webkit-scrollbar{display:none}

/* ===== Header ===== */
.hd{background:var(--brand);color:#fff}
.hd-in{max-width:1170px;margin:0 auto;display:flex;justify-content:space-between;align-items:center;padding:14px 16px}
.logo{display:flex;align-items:center;gap:6px;color:#fff}
.logo .ta{font:800 44px/1 Arial,sans-serif;letter-spacing:-3px}
.logo .lt{font:700 15px/1.05 Arial,sans-serif}
.hot{display:flex;gap:20px;color:var(--gold);font:700 15.5px var(--f-ui);text-align:center}
.hot small{display:block;color:#d6e0ff;font-weight:500;font-size:11px}
.hd-links{display:flex;gap:18px;justify-content:flex-end;font:500 14.5px var(--f-ui);margin-top:6px}
.mn{border-bottom:1px solid var(--line);background:#fff}
.mn-in{max-width:1170px;margin:0 auto;display:flex;justify-content:space-between;padding:10px 16px;color:var(--brand);font:500 15px var(--f-ui)}
.hd-m{background:#fff;display:flex;justify-content:space-between;align-items:center;padding:10px 14px;border-bottom:1px solid var(--line)}
.hd-m .brandtxt{font:700 21px var(--f-ui);color:var(--brand)}.hd-m .brandtxt span{font-weight:400;color:#2f6ee0}
.burger{width:22px;height:16px;border-top:2.5px solid var(--brand);border-bottom:2.5px solid var(--brand);position:relative}
.burger::after{content:"";position:absolute;left:0;right:0;top:4.5px;border-top:2.5px solid var(--brand)}
.srch{width:18px;height:18px;border:2.5px solid var(--brand);border-radius:50%;position:relative}
.srch::after{content:"";position:absolute;width:7px;border-top:2.5px solid var(--brand);right:-6px;bottom:-3px;transform:rotate(45deg)}

/* ===== Lưới trang ===== */
.pg{margin:0 auto;padding:20px 16px 40px;display:grid;align-items:start}
.pg.now{grid-template-columns:148px minmax(0,874px) 262px;column-gap:12px;justify-content:center}
.pg.A{grid-template-columns:44px minmax(0,865px) 300px;column-gap:28px;justify-content:center}
.pg.B{grid-template-columns:190px 44px minmax(0,800px) 300px;column-gap:20px;justify-content:center}
.pg.B3{grid-template-columns:190px minmax(0,865px) 300px;column-gap:24px;justify-content:center}
.share-card{padding:12px}
.share-card .ct{margin-bottom:8px}
.share-row{display:flex;gap:7px;flex-wrap:wrap}
.share-row .sh{width:34px;height:34px}
.pg.m{display:block;padding:12px 14px 24px}
.pg.t{display:block;max-width:760px;padding:20px 22px 30px}

/* ===== Bài viết ===== */
.crumb{font:500 12.5px var(--f-ui);color:var(--mut);text-transform:uppercase;letter-spacing:.03em;margin-bottom:8px}
.crumb b{color:var(--brand);font-weight:600}
h1.ttl{font:700 21px/1.35 var(--f-body);color:var(--brand);text-transform:uppercase;margin:0 0 10px;text-wrap:balance}
.m h1.ttl{font-size:19px}
.meta{display:flex;flex-wrap:wrap;gap:10px;align-items:center;font:500 13px var(--f-ui);color:var(--mut);margin-bottom:12px}
.ggpill{border:1px solid var(--line);border-radius:20px;padding:4px 11px;color:var(--ink)}
.ggpill b{color:#4285f4}
.top2{display:grid;grid-template-columns:minmax(0,1fr) 360px;gap:18px;align-items:start}
.top2.nodoc,.m .top2,.t .top2{display:block}
.doc{display:flex;gap:12px;align-items:center;border:1px solid var(--line);border-radius:var(--r-l);padding:12px 14px;box-shadow:var(--shadow);font:500 13.5px/1.4 var(--f-ui);color:var(--ink);background:#fff}
.m .doc,.t .doc{margin:12px 0}
.av{width:62px;height:62px;border-radius:50%;background:linear-gradient(145deg,var(--brand-100),#9fb5ea);flex:none;display:flex;align-items:center;justify-content:center;color:var(--brand);font:700 17px var(--f-ui)}
.doc .lb{color:var(--mut);font-size:12.5px}
.doc .nm{font-weight:700;text-transform:uppercase;font-size:13.5px;margin:2px 0}
.doc .bt{display:flex;gap:6px;margin-top:8px}
.doc .bt span{font-size:11.5px;font-weight:700;padding:6px 11px;border-radius:5px;color:#fff;background:var(--brand);letter-spacing:.02em}
.doc .bt span+span{background:#5d6678}
.sapo{margin:0;color:var(--txt)}
.feat{width:100%;height:auto;display:block;margin:16px 0;border-radius:2px;background:var(--tint)}
.feat-ph{aspect-ratio:1200/628;background:linear-gradient(135deg,var(--brand-50),var(--brand-100));display:flex;align-items:center;justify-content:center;color:var(--mut);font:500 14px var(--f-ui);margin:16px 0}
.art p{margin:0 0 15px}
.art h2{font:700 21px/1.35 var(--f-body);color:var(--ink);margin:30px 0 12px;text-wrap:balance;scroll-margin-top:16px}
.art h3{font:700 18px/1.4 var(--f-body);color:var(--ink);margin:20px 0 10px;scroll-margin-top:16px}
.m .art h2{font-size:19.5px}.m .art h3{font-size:17px}
.art ul{margin:0 0 15px;padding-left:22px}
.art li{margin-bottom:6px}
.fig{margin:18px 0}
.fig .ph{aspect-ratio:16/9;background:linear-gradient(135deg,#eaf0fa,#cfdbf2);display:flex;align-items:center;justify-content:center;color:#5d6d92;font:500 13px var(--f-ui)}
.fig figcaption{font-size:14px;color:var(--mut);text-align:center;font-style:italic;margin-top:6px}
.alert{border-left:4px solid #f0a020;background:#fff8e8;padding:11px 15px;margin:0 0 15px;font-size:15.5px;border-radius:0 6px 6px 0}
.toc{border:1px solid var(--line);border-radius:var(--r-m);margin:16px 0 20px;font:500 15px/1.45 var(--f-ui);overflow:hidden}
.toc .th{display:flex;justify-content:space-between;align-items:center;padding:10px 14px;background:var(--tint);border-bottom:1px solid var(--line);font-weight:700;color:var(--ink)}
.toc ol{margin:0;padding:10px 16px 12px 34px;color:var(--brand)}
.toc li{margin:4px 0}
.toc ol ol{padding:2px 0 2px 18px;list-style:lower-alpha;color:#3f5aa5;font-size:14px}
.toc a{color:inherit;text-decoration:none}
.mockflag{font:600 12px var(--f-ui);color:var(--warn);background:var(--warn-50);border:1px dashed #e5b04b;padding:3px 9px;border-radius:5px;display:inline-block;margin-bottom:10px}
.endshare{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin:20px 0 4px;font:500 14px var(--f-ui);color:var(--mut)}
.related h4{font:700 19px var(--f-ui);color:var(--brand);margin:30px 0 12px;text-transform:uppercase;letter-spacing:.02em}
.rgrid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px}
.m .rgrid{grid-template-columns:1fr}
.rc .im{aspect-ratio:16/9;background:linear-gradient(135deg,#eaf0fa,#cfdbf2);border-radius:6px}
.rc p{font:600 15px/1.35 var(--f-ui);color:var(--ink);margin:8px 0 0}
.foot{background:var(--brand-d);color:#c9d4f2;font:500 13px var(--f-ui);padding:24px 16px;text-align:center}

/* ===== Hộp hệ thống bệnh viện ===== */
.hbox{margin:26px 0 8px;border:1px solid var(--line);border-radius:var(--r-l);overflow:hidden;font-family:var(--f-ui);box-shadow:var(--shadow)}
.hbox-t{background:var(--brand);color:#fff;font-weight:700;font-size:15.5px;letter-spacing:.04em;text-transform:uppercase;padding:12px 16px;display:flex;justify-content:space-between;align-items:center;gap:8px}
.hbox-t span{font-weight:600;font-size:12px;letter-spacing:.02em;background:var(--gold);color:var(--ink);padding:3px 9px;border-radius:20px;text-transform:none}
.hcols{display:grid;grid-template-columns:1fr 1fr}
.hcols .hreg+.hreg{border-left:1px solid var(--line)}
.hreg{display:flex;flex-direction:column}
.hreg-h{display:flex;justify-content:space-between;align-items:baseline;padding:12px 16px 4px}
.hreg-h b{font-size:17px;color:var(--brand)}
.hreg-h span{font-size:12.5px;color:var(--mut)}
.hsites{list-style:none;margin:0;padding:4px 16px 8px;display:grid;gap:0;flex:1}
.hsites li{padding:11px 0;border-bottom:1px dashed var(--line);display:grid;gap:3px}
.hsites li:last-child{border-bottom:0}
.hs-n{font-weight:700;font-size:15px;color:var(--ink);display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.er{font-size:11px;font-weight:700;color:var(--danger);background:#fdecea;border-radius:4px;padding:1px 6px}
.hs-a{font-size:14px;color:var(--txt);line-height:1.4}
.hs-t{font-size:13px;color:var(--mut);font-variant-numeric:tabular-nums}
.hs-map{font-size:13px;font-weight:600;color:var(--brand);text-decoration:none;justify-self:start}
.hs-map:hover{text-decoration:underline}
.hreg-f{display:flex;flex-wrap:wrap;gap:8px;padding:12px 16px 14px;background:var(--tint);border-top:1px solid var(--line);align-items:center}
.hot-btn{display:inline-flex;gap:6px;align-items:center;font-weight:700;font-size:15px;color:var(--brand);background:#fff;border:1px solid var(--brand-100);border-radius:8px;padding:7px 11px;text-decoration:none;font-variant-numeric:tabular-nums}
.hot-btn svg{width:15px;height:15px}
.hmail{font-size:13px;color:var(--mut);width:100%}
.htabs{display:grid;grid-template-columns:1fr 1fr;border-bottom:1px solid var(--line);background:var(--tint)}
.htabs button{border:0;background:none;padding:11px 8px;font:700 15px var(--f-ui);color:var(--mut);border-bottom:3px solid transparent;cursor:pointer}
.htabs button[aria-selected="true"]{color:var(--brand);border-bottom-color:var(--brand);background:#fff}
.htabs~.hreg .hreg-h{display:none}

/* ===== Banner ===== */
.bnr{position:relative;display:block;border-radius:8px;overflow:hidden;background:var(--brand-50)}
.bnr.side{aspect-ratio:262/343}
.bnr.inl{aspect-ratio:1712/696}
.bimg{display:block;width:100%;height:100%;object-fit:cover}
.bfb{position:absolute;inset:0;display:flex;flex-direction:column;justify-content:flex-end;padding:14px;color:#fff;gap:4px;font-family:var(--f-ui)}
.bfb b{font-size:18px;line-height:1.2}.bfb span{font-size:12.5px;opacity:.9}
.adlbl{font:500 11px var(--f-ui);color:#9aa4b8;letter-spacing:.04em;text-transform:uppercase}
.svc-lbl{font:600 13px var(--f-ui);color:var(--brand);display:flex;align-items:center;gap:6px}
.svc-lbl::before{content:"";width:3px;height:13px;border-radius:2px;background:var(--gold)}
.inl-ad{margin:8px 0 22px}
.inl-ad .adlbl{display:block;text-align:right;margin-bottom:4px}
/* carousel */
.car{font-family:var(--f-ui)}
.car-top{display:flex;justify-content:space-between;align-items:center;margin-bottom:5px}
.car-stage{position:relative}
.car-view{overflow:hidden;border-radius:8px;touch-action:pan-y;cursor:grab;user-select:none;-webkit-user-select:none}
.car-view:active{cursor:grabbing}
.car-strip{display:flex;gap:10px;transition:transform .45s cubic-bezier(.2,.7,.2,1);will-change:transform}
.car-sl{flex:0 0 100%}
.car-inl .car-sl{flex-basis:87%}
.car-sl img{pointer-events:none;-webkit-user-drag:none}
.car-dots{display:flex;gap:5px;margin-top:9px}
.car-dots button{flex:1;height:4px;border:0;border-radius:3px;background:#dbe1ec;padding:0;cursor:pointer;position:relative;overflow:hidden}
.car-dots button i{position:absolute;inset:0 auto 0 0;width:0;background:var(--brand)}
.car-dots button.past i{width:100%}
.car-ar{position:absolute;top:50%;transform:translateY(-50%);width:34px;height:34px;border-radius:50%;border:0;background:rgba(255,255,255,.95);box-shadow:0 2px 10px rgba(0,0,0,.22);color:var(--ink);font:700 20px/1 var(--f-ui);display:flex;align-items:center;justify-content:center;cursor:pointer;z-index:2}
.car-ar.prev{left:6px}.car-ar.next{right:6px}
.car-n{font-size:12px;font-weight:600;color:var(--mut);font-variant-numeric:tabular-nums}

/* ===== Cột bên ===== */
.rail{position:sticky;top:16px;display:grid;gap:14px;transition:top .2s}
.rail-now{display:grid;gap:10px}
.share-v{position:sticky;top:16px;display:flex;flex-direction:column;align-items:center;gap:12px;padding-top:6px;font-family:var(--f-ui)}
.share-v .lb{font-size:12px;color:var(--mut);font-weight:500}
.share-v hr{width:26px;border:0;border-top:1px solid var(--line);margin:2px 0}
.sh{width:38px;height:38px;border-radius:50%;border:1px solid var(--line);background:#fff;display:flex;align-items:center;justify-content:center;cursor:pointer;padding:0;transition:transform .15s,box-shadow .15s}
.sh:hover{transform:translateY(-1px);box-shadow:0 3px 10px rgba(18,44,107,.15)}
.sh svg{width:19px;height:19px}
.share-h{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin:6px 0 12px;font:500 13.5px var(--f-ui);color:var(--mut)}
.share-h .sh{width:34px;height:34px}
.ltoc{position:sticky;top:16px;display:grid;gap:12px;font-family:var(--f-ui)}
.ltoc .card{padding:14px 12px}
.ltoc .ct{font-weight:700;font-size:15px;color:var(--ink);margin-bottom:8px;display:flex;justify-content:space-between;align-items:baseline}
.ltoc .ct span{font-size:12px;color:var(--mut);font-weight:500;font-variant-numeric:tabular-nums}
.ltoc ol{list-style:none;margin:0;padding:0;display:grid;gap:2px;counter-reset:t}
.ltoc li{counter-increment:t}
.ltoc button{all:unset;box-sizing:border-box;display:grid;grid-template-columns:20px 1fr;gap:2px;width:100%;cursor:pointer;font-size:13.5px;line-height:1.35;padding:6px 8px 6px 6px;border-radius:6px;color:var(--mut)}
.ltoc button::before{content:counter(t);font-weight:700;color:#a3adc2}
.ltoc button:hover{background:var(--tint);color:var(--ink)}
.ltoc button.on{color:var(--brand);font-weight:700;background:var(--brand-50)}
.ltoc button.on::before{color:var(--brand)}
.prog{height:4px;background:#e6eaf2;border-radius:3px;overflow:hidden;margin-bottom:12px}
.prog i{display:block;height:100%;width:0;background:var(--brand);transition:width .15s}

/* ===== Module ===== */
.card{background:#fff;border:1px solid var(--line);border-radius:var(--r-l);padding:16px;box-shadow:var(--shadow);font-family:var(--f-ui)}
.bk-h{margin-bottom:12px}
.bk-h b{display:block;font-size:19px;color:var(--brand);letter-spacing:.01em}
.bk-h span{font-size:13px;color:var(--mut)}
.kt{margin-bottom:6px}
.kt-lbl{display:block;font-size:12.5px;font-weight:600;color:#4a5468;margin-bottom:5px}
.kt-tab{width:100%;min-height:44px;text-align:left;border:1.5px solid var(--brand);background:var(--brand-50);color:var(--brand);border-radius:9px;padding:8px 12px;cursor:pointer;display:flex;justify-content:space-between;align-items:center;gap:8px;font-family:var(--f-ui)}
.kt-tab b{font-size:15.5px}
.kt-tab i{font-style:normal;font-size:13px;transition:transform .2s;display:inline-block}
.kt-tab[aria-expanded="true"]{background:var(--brand);color:#fff}
.kt-tab[aria-expanded="true"] i{transform:rotate(180deg)}
.kt-opts{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px;padding:10px;background:var(--tint);border-radius:9px}
.kt-opts button{border:1px solid var(--line);background:#fff;color:var(--ink);border-radius:20px;padding:5px 11px;font:500 13.5px var(--f-ui);cursor:pointer}
.kt-opts button[aria-pressed="true"]{border-color:var(--brand);background:var(--brand);color:#fff}
.fl{display:block;font-size:12.5px;font-weight:600;color:#4a5468;margin:10px 0 4px}
.inp{width:100%;font:500 15px var(--f-ui);padding:10px 12px;border:1px solid #cdd5e3;border-radius:8px;background:#fff;color:var(--ink);min-height:44px}
.inp::placeholder{color:#a0a9bb;font-weight:400}
.inp:focus{outline:none;border-color:var(--brand);box-shadow:0 0 0 3px var(--brand-100)}
.inp[aria-invalid="true"]{border-color:var(--danger);box-shadow:0 0 0 3px #fbdcd6}
textarea.inp{min-height:84px;resize:vertical}
.err{display:block;color:var(--danger);font-size:12.5px;margin-top:4px}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chips button{font:500 13.5px var(--f-ui);border:1px solid #cdd5e3;background:#fff;color:var(--ink);border-radius:20px;padding:6px 12px;cursor:pointer}
.chips button[aria-pressed="true"]{border-color:var(--brand);background:var(--brand-50);color:var(--brand);font-weight:700}
.chk{display:flex;gap:8px;align-items:flex-start;font-size:13px;color:#4a5468;margin-top:10px;line-height:1.35;cursor:pointer}
.chk input{margin:2px 0 0;width:16px;height:16px;accent-color:var(--brand)}
.btn{width:100%;margin-top:12px;font:700 16px var(--f-ui);letter-spacing:.02em;border:0;border-radius:9px;padding:12px;background:var(--brand);color:#fff;cursor:pointer;min-height:48px;transition:background .15s}
.btn:hover{background:var(--brand-d)}
.btn.gh{background:#fff;color:var(--brand);border:1.5px solid var(--brand)}
.btn.gh:hover{background:var(--brand-50)}
.sos{font-size:12.5px;color:var(--danger);margin:10px 0 0;line-height:1.35;display:flex;gap:6px;align-items:flex-start}
.sos::before{content:"!";flex:none;width:16px;height:16px;border-radius:50%;background:var(--danger);color:#fff;font-weight:700;font-size:11px;display:flex;align-items:center;justify-content:center;margin-top:1px}
.done{background:var(--ok-50);color:var(--ok);border-radius:10px;padding:14px;font-size:14.5px;line-height:1.45}
.done b{display:block;margin-bottom:4px;font-size:16px}
.qa{list-style:none;margin:0 0 6px;padding:0;display:grid}
.qa li{font-size:15px;line-height:1.38;padding:10px 0;border-bottom:1px dashed var(--line)}
.qa li:first-child{padding-top:2px}
.qa a{color:var(--ink);text-decoration:none;font-weight:600}
.qa a:hover{color:var(--brand)}
.qa span{display:block;font-size:12.5px;color:var(--mut);margin-top:3px}
.ctx{margin:24px 0}

.an.bad{color:#fff;background:var(--danger);border-color:var(--danger)}

.noanno .an{display:none}

.noanno .void{border-color:transparent;color:transparent}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}

const OLD_LINES=[9,13];
function oldSlots(art){let line=1;const out=[];
 art.blocks.forEach((b,bi)=>{

  if(b.t==='ul')b.items.forEach((_,li)=>{line++;OLD_LINES.forEach((L,k)=>{if(line===L)out.push({bi,li,k,line:L})})})});

function measure(art){const bl=art.blocks,wc=bl.map(b=>b.t==='ul'?words(b.items.join(' ')):b.t==='fig'?0:words(b.x||''));
 const sw=words(art.sapo),total=wc.reduce((a,b)=>a+b,0)+sw;

function newSlots(art){const M=measure(art),{bl,total,before,h2s}=M;
 if(total<350||M.pCount<4)return {mode:'end',slots:[]};
 const slots=[],maxSlots=total>=900?2:1,targets=[.3,.65];
 if(h2s.length>=3){
  for(const t of targets){if(slots.length>=maxSlots)break;
   const c=h2s.slice(1).find(i=>before(i)/total>=t&&!slots.some(s=>s.bi===i)&&(!slots.length||before(i)-before(slots[slots.length-1].bi)>=300)&&!/kết luận|câu hỏi thường gặp/i.test(bl[i].x));
   if(c!=null)slots.push({bi:c,why:`trước H2 #${h2s.indexOf(c)+1}, mốc ${Math.round(before(c)/total*100)}% bài`})}
  return {mode:'h2',slots}}
 const cands=[];for(let i=1;i<bl.length;i++){const a=bl[i-1],b=bl[i];if(a.t==='p'&&b.t==='p'&&!/:\s*$/.test(a.x)&&before(i)>=150)cands.push(i)}
 for(const t of targets){if(slots.length>=maxSlots)break;let best=null,bd=1;
  cands.forEach(i=>{const d=Math.abs(before(i)/total-t);if(d<bd&&!slots.some(s=>Math.abs(before(s.bi)-before(i))<300)){bd=d;best=i}});
  if(best!=null)slots.push({bi:best,why:`giữa 2 đoạn văn, mốc ${Math.round(before(best)/total*100)}% bài (bài không đủ 3 H2)`})}
 return {mode:'para',slots}}

const ACTION=/điều trị|xử lý|xử trí|khi nào|đi khám|gặp bác sĩ|nhập viện|chẩn đoán|ở đâu|địa chỉ|chi phí/i;
function ctxSlots(art,used){const M=measure(art),{bl,total,before,h2s}=M;let form='end',fwhy,qa=null;
 if(h2s.length<3){fwhy='P3 · bài dưới 3 H2 → form ở cuối bài, trước hộp thông tin bệnh viện';return {form,fwhy,qa}}
 const k=h2s.findIndex(i=>ACTION.test(bl[i].x));
 if(k>=0){const nx=h2s[k+1];
  if(nx==null){fwhy=`P1 · mục "${bl[h2s[k]].x.slice(0,38)}…" là H2 cuối → form ở cuối bài`}
  else if(before(nx)/total>=.4&&!used.includes(nx)){form=nx;fwhy=`P1 · ngay sau mục có từ khóa hành động "${bl[h2s[k]].x.slice(0,38)}…"`}}
 if(!fwhy){const c=h2s.slice(1).find(i=>before(i)/total>=.6&&!used.includes(i));
  if(c!=null){form=c;fwhy=`P2 · không có mục hành động → trước H2 #${h2s.indexOf(c)+1} (H2 đầu tiên sau mốc 60%)`}else fwhy='P2 · không còn H2 phù hợp → cuối bài'}
 const free=h2s.slice(1).filter(i=>!used.includes(i)&&i!==form&&Math.abs(h2s.indexOf(i)-h2s.indexOf(form))>=1);
 if(free.length){let best=free[0],bd=9;free.forEach(i=>{const d=Math.abs(before(i)/total-.5);if(d<bd){bd=d;best=i}});
  if(form==='end'||Math.abs(h2s.indexOf(best)-h2s.indexOf(form))>=1)qa=best}
 return {form,fwhy,qa}}

/* ============ Carousel: kéo/vuốt + tự chuyển ============ */
let cars=[];
function initCars(){cars.forEach(c=>c.io&&c.io.disconnect());cars=[];
 vp.querySelectorAll('[data-car]').forEach(el=>{
  const c={el,strip:el.querySelector('.car-strip'),view:el.querySelector('.car-view'),n:el.querySelectorAll('.car-sl').length,i:0,t:0,hover:false,vis:true,drag:null,moved:false};
  cars.push(c);if(c.n<2)return;
  el.addEventListener('mouseenter',()=>c.hover=true);el.addEventListener('mouseleave',()=>c.hover=false);
  c.view.addEventListener('pointerdown',e=>{if(e.button!==0)return;c.drag={x:e.clientX,y:e.clientY,dx:0,id:e.pointerId};c.moved=false});
  c.view.addEventListener('pointermove',e=>{if(!c.drag)return;const dx=e.clientX-c.drag.x,dy=e.clientY-c.drag.y;
   if(!c.moved&&Math.abs(dx)>6&&Math.abs(dx)>Math.abs(dy)){c.moved=true;c.strip.style.transition='none';try{c.view.setPointerCapture(c.drag.id)}catch(_){}}
   if(c.moved){c.drag.dx=dx;place(c)}});
  const end=()=>{if(!c.drag)return;const dx=c.drag.dx,moved=c.moved;c.drag=null;c.strip.style.transition='';if(moved&&Math.abs(dx)>40)carGo(c,c.i+(dx<0?1:-1));else place(c)};
  c.view.addEventListener('pointerup',end);c.view.addEventListener('pointercancel',end);
  c.view.addEventListener('click',e=>{if(c.moved){e.preventDefault();e.stopPropagation();c.moved=false}},true);
  if('IntersectionObserver' in window){c.io=new IntersectionObserver(es=>{c.vis=es[0].intersectionRatio>=.5},{root:vp,threshold:[0,.5,1]});c.io.observe(el)}
  place(c)})}
function place(c){const sl=c.strip.children;if(!sl.length)return;const gap=parseFloat(getComputedStyle(c.strip).columnGap)||0;
 const w=sl[0].getBoundingClientRect().width+gap,max=Math.max(0,c.strip.scrollWidth-c.view.clientWidth),off=Math.min(c.i*w,max),dx=c.drag&&c.moved?c.drag.dx:0;
 c.strip.style.transform=`translateX(${-off+dx}px)`;
 c.el.querySelectorAll('.car-dots button').forEach((d,j)=>{d.classList.toggle('past',j<c.i);d.setAttribute('aria-current',String(j===c.i));if(j!==c.i)d.querySelector('i').style.width=''});
 const n=c.el.querySelector('[data-n]');if(n)n.textContent=(c.i+1)+'/'+c.n}
function carGo(c,i){c.i=(i+c.n)%c.n;c.t=0;place(c)}
setInterval(()=>{cars.forEach(c=>{if(c.n<2)return;if(reduce||c.hover||c.drag||!c.vis||document.hidden)return;
 c.t+=100;const d=c.el.querySelectorAll('.car-dots button')[c.i];if(d)d.querySelector('i').style.width=Math.min(100,c.t/AUTO*100)+'%';
 if(c.t>=AUTO)carGo(c,c.i+1)})},100);

function watchRail(){if(ro)ro.disconnect();const r=vp.querySelector('.rail');if(!r||!('ResizeObserver' in window)){fitRail();return}ro=new ResizeObserver(fitRail);ro.observe(r);fitRail()}

/* ============ Cuộn ============ */
let lastTop=0;
function readPct(){const max=vp.scrollHeight-vp.clientHeight;return max>0?vp.scrollTop/max:0}
function activeSec(){const top=vp.getBoundingClientRect().top;let a='';vp.querySelectorAll('.art h2[id], .art h3[id]').forEach(h=>{if(h.getBoundingClientRect().top-top<150)a=h.id});return a}
function onScroll(){const pct=readPct();

 vp.querySelectorAll('[data-pct]').forEach(i=>i.textContent=Math.round(pct*100)+'%');
 const act=activeSec(),a2=act?act.split('-')[0]:'s0';
 vp.querySelectorAll('[data-tocn]').forEach(b=>b.classList.toggle('on','s'+b.dataset.tocn===a2));
 const bar=vp.querySelector('[data-bar]');if(bar){if(vp.scrollTop>lastTop+2&&vp.scrollTop>200)bar.classList.add('hide');else if(vp.scrollTop<lastTop-2)bar.classList.remove('hide')}
 const fab=fabroot.querySelector('.fab');if(fab){const t=vp.querySelector('#inline-toc');const past=t?t.getBoundingClientRect().bottom<vp.getBoundingClientRect().top:vp.scrollTop>400;
  const end=vp.querySelector('.hbox, .related');const atEnd=end&&end.getBoundingClientRect().top<vp.getBoundingClientRect().top+vp.clientHeight*.5;
  fab.classList.toggle('off',!past||atEnd);const ring=fab.querySelector('[data-ring]');if(ring)ring.setAttribute('stroke-dashoffset',String(147.65*(1-pct)))}
 lastTop=vp.scrollTop}
vp.addEventListener('scroll',onScroll,{passive:true});

function sheet(k){if(k==='book')openSheet('Đặt lịch khám',booking());
 else if(k==='ask')openSheet('Hỏi bác sĩ',ask(2,true));
 else openSheet('Gọi tổng đài',`<div class="hbox" style="margin:4px 0 0;box-shadow:none">${REGIONS.map(r=>`<div style="padding:12px 14px;border-bottom:1px solid var(--line)"><b style="color:var(--brand);font-size:16px">${r.name}</b><div style="display:flex;flex-wrap:wrap;gap:8px;margin-top:8px">${r.hot.map(h=>`<a class="hot-btn" href="tel:${h.replace(/\s/g,'')}" data-act="toast" data-m="Gọi ${h}">${ICON.phone}${h}</a>`).join('')}</div></div>`).join('')}<p class="sos" style="padding:0 14px 12px">Cấp cứu: gọi 115 hoặc đến khoa Cấp cứu 24/7</p></div>`)}
function tocSheet(){const items=tocItems(A()),act=activeSec(),pct=Math.round(readPct()*100);
 openSheet('Mục lục',`<div class="tocp"><div class="rd">Đã đọc ${pct}%</div><div class="prog" style="margin-top:6px"><i style="width:${pct}%"></i></div><ol>${items.map(t=>`<li><a href="#${t.id}" class="${t.lvl===3?'h3':''}${t.id===act||(t.lvl===2&&act.split('-')[0]===t.id&&!items.some(x=>x.id===act&&x.lvl===3))?' on':''}" data-act="jump" data-id="${t.id}" data-close="1">${esc(t.x)}</a></li>`).join('')}</ol></div>`)}
function jump(id){const h=vp.querySelector('#'+CSS.escape(id));if(!h)return;vp.scrollTo({top:h.getBoundingClientRect().top-vp.getBoundingClientRect().top+vp.scrollTop-12,behavior:reduce?'auto':'smooth'})}
const carOf=el=>cars.find(c=>c.el===el.closest('[data-car]'));
frame.addEventListener('click',e=>{
 const chip=e.target.closest('.chips button');
 if(chip&&chip.hasAttribute('data-sug')){const f=chip.closest('form'),ta=f.querySelector('[data-q]');ta.value=chip.textContent;f.querySelector('[data-step2]').hidden=false;ta.focus();return}
 if(chip){const g=chip.parentElement;if(g.hasAttribute('data-single'))g.querySelectorAll('button').forEach(x=>x.setAttribute('aria-pressed',String(x===chip)));return}
 const a=e.target.closest('[data-act]');if(!a)return;const act=a.dataset.act;
 if(act==='close'){if(e.target===a||a.classList.contains('x'))ovroot.innerHTML='';return}
 e.preventDefault();
 if(act==='share'){const k=a.dataset.k;
  if(k==='ln'){const url='https://tamanhhospital.vn/bi-sot-xuat-huyet-khi-mang-thai-3-thang-dau/';(navigator.clipboard?navigator.clipboard.writeText(url):Promise.reject()).then(()=>toast('Đã sao chép liên kết bài viết')).catch(()=>toast('Không sao chép được, hãy copy từ thanh địa chỉ'));return}
  if(k==='up'){vp.scrollTo({top:0});return}
  if(k==='na'){if(navigator.share)navigator.share({title:A().title,url:location.href}).catch(()=>{});else toast('Trên điện thoại sẽ mở bảng chia sẻ của máy (Zalo, Messenger, tin nhắn…)');return}
  toast({fb:'Mở hộp chia sẻ Facebook',zl:'Mở chia sẻ Zalo',ms:'Mở chia sẻ Messenger',tw:'Mở chia sẻ Twitter',pi:'Mở chia sẻ Pinterest'}[k]+' (demo)');return}
 if(act==='bclick'){toast('Click banner: ghi sự kiện banner_click ('+a.dataset.k+') rồi mở trang chương trình');return}
 if(act==='cprev'||act==='cnext'||act==='cgo'){const c=carOf(a);if(!c)return;carGo(c,act==='cgo'?+a.dataset.i:c.i+(act==='cnext'?1:-1));return}
 if(act==='ktog'){const kt=a.closest('[data-kt]'),o=kt.querySelector('.kt-opts'),open=o.hidden;o.hidden=!open;kt.querySelectorAll('[data-act="ktog"]').forEach(b=>b.setAttribute('aria-expanded',String(open)));return}
 if(act==='kpick'){const kt=a.closest('[data-kt]'),k=a.textContent;kt.querySelector('[data-kname]').textContent=k;kt.querySelector('[data-kval]').value=k;
  kt.querySelectorAll('.kt-opts button').forEach(b=>b.setAttribute('aria-pressed',String(b===a)));kt.querySelector('.kt-opts').hidden=true;kt.querySelectorAll('[data-act="ktog"]').forEach(b=>b.setAttribute('aria-expanded','false'));return}
 if(act==='ask'){const f=a.parentElement.querySelector('form[data-form="ask"]');f.hidden=false;a.hidden=true;f.querySelector('textarea').focus();return}
 if(act==='htab'){const box=a.closest('.hbox');box.querySelectorAll('[data-act="htab"]').forEach(b=>b.setAttribute('aria-selected',String(b===a)));box.querySelectorAll('.hreg').forEach(r=>r.hidden=r.dataset.reg!==a.dataset.k);return}
 if(act==='jump'){if(a.dataset.close)ovroot.innerHTML='';jump(a.dataset.id);return}
 if(act==='tocopen'){tocSheet();return}
 if(act==='sheet'){sheet(a.dataset.k);return}
 if(act==='toast'){toast(a.dataset.m);return}
});
frame.addEventListener('input',e=>{const t=e.target;if(t.matches('[data-q]'))t.closest('form').querySelector('[data-step2]').hidden=t.value.trim().length<10;
 if(t.matches('[data-tel]')&&t.getAttribute('aria-invalid')==='true')validTel(t)});
frame.addEventListener('focusout',e=>{const t=e.target;if(t.matches&&t.matches('[data-tel]')&&t.value)validTel(t)});
function validTel(t){const ok=/^0(3|5|7|8|9)\d{8}$/.test(t.value.replace(/[\s.]/g,''));t.setAttribute('aria-invalid',String(!ok));t.nextElementSibling.hidden=ok;return ok}
frame.addEventListener('submit',e=>{e.preventDefault();const f=e.target;let ok=true;
 const tel=f.querySelector('[data-tel]');if(tel&&!validTel(tel))ok=false;
 const nm=f.querySelector('[data-name]');if(nm){const bad=!nm.value.trim();nm.setAttribute('aria-invalid',String(bad));if(bad)ok=false}
 const c=f.querySelector('[data-consent]'),ce=f.querySelector('[data-cerr]');if(c&&!c.checked){ce.hidden=false;ok=false}else if(ce)ce.hidden=true;
 if(!ok)return;
 if(f.dataset.form==='book'){const site=f.querySelector('[data-site]').value,khoa=f.querySelector('[data-kval]').value,hot=/Hà Nội|Cầu Giấy/.test(site)?'024 3872 3872':'028 7102 6789';
  f.innerHTML=`<div class="done"><b>Đã nhận yêu cầu đặt lịch</b>Khoa ${esc(khoa)} tại ${esc(site)}. CSKH sẽ gọi lại số ${esc(tel.value)} để chốt ngày giờ. Cần gấp, gọi ${hot}.</div><p class="sos">Bản mô phỏng: không có dữ liệu nào được gửi đi.</p>`}
 else f.innerHTML=`<div class="done"><b>Đã gửi câu hỏi</b>Bác sĩ ${CATE} sẽ trả lời qua thông tin liên hệ bạn để lại.</div><p class="sos">Bản mô phỏng: không có dữ liệu nào được gửi đi.</p>`});

/* ============ Toolbar ============ */
document.querySelectorAll('.sg[data-k]').forEach(g=>g.addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;const k=g.dataset.k;
 S[k]=k==='n'?+b.dataset.v:b.dataset.v;if(k==='lay')S.rule=S.lay==='now'?'old':'new';render()}));
document.getElementById('annoT').addEventListener('change',e=>{S.anno=e.target.checked;vp.classList.toggle('noanno',!S.anno);fitRail();save()});
let rt;window.addEventListener('resize',()=>{clearTimeout(rt);rt=setTimeout(render,200)});
render();
})();
</script>
</body>
</html>
